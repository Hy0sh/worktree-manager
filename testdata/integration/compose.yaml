services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: widgets
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fixture
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-15433}:5432"
  api:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:fixture@db:5432/widgets}
    ports:
      - "${API_PORT:-18099}:8099"
    command: sh -c "pip install -q psycopg[binary] && python3 server.py"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
