name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The whole suite runs without git, docker or node: every external
      # command goes through an injectable runner. Keep it that way.
      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # govulncheck reports the standard library of the toolchain it runs
      # under, so on this module's floor it reports every patch released since
      # that floor: 25 of them at v0.9.0, none of which this code introduced.
      # GOTOOLCHAIN=auto did not help, because the toolchain setup-go installs
      # already satisfies go.mod. It worked while the directive read `go 1.25`,
      # which setup-go resolves to the newest 1.25.x, and broke the moment a
      # `go get` normalised it to `go 1.25.0`, an exact version. That
      # normalisation cannot be undone: `go mod tidy` puts it straight back.
      # So these two steps get the current stable toolchain of their own. The
      # build and the tests above stay on the floor, which is the point.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # go vet says nothing about code nobody calls any more, which is how two
      # functions survived a rewrite of the compose plumbing.
      - name: Unused code
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -o wtm ./cmd/wtm
      - run: WTM=$PWD/wtm bash testdata/integration/run.sh
