name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The whole suite runs without git, docker or node: every external
      # command goes through an injectable runner. Keep it that way.
      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      # govulncheck and staticcheck both need a newer Go than this module's
      # floor, and setup-go pins GOTOOLCHAIN=local, so these two steps are
      # allowed to fetch the toolchain they need. The build above stays on the
      # floor, which is the point.
      - name: Vulnerabilities
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # go vet says nothing about code nobody calls any more, which is how two
      # functions survived a rewrite of the compose plumbing.
      - name: Unused code
        env:
          GOTOOLCHAIN: auto
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
